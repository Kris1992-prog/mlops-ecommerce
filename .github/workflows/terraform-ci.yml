name: 'Terraform CI'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-ci:
    name: 'Terraform Fmt, Validate & Plan'
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Configura le credenziali AWS
      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1 # Cambia se usi una regione diversa

      # 3. Avvia un cluster Kubernetes temporaneo (KinD) per i test
      - name: Create Kubernetes KinD Cluster
        uses: helm/kind-action@v1.12.0

      # 4. Installa l'eseguibile di Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Inizializza i provider (terraform init)
      - name: Terraform Init
        run: terraform init

      # 6. Controllo Formattazione (fmt)
      - name: Controllo Formattazione (fmt)
        run: terraform fmt -check

      # 7. Validazione Codice (validate)
      - name: Validazione Codice (validate)
        run: terraform validate
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR }}

      # 8. Anteprima Modifiche (plan)
      - name: Anteprima Modifiche (plan)
        run: terraform plan -no-color -input=false -lock=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR }}